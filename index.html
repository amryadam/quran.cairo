<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إذاعة القرآن الكريم - البث المباشر</title>
    <!-- hls.js: needed to play the official misrquran.gov.eg HLS stream in Chrome.
         If it fails to load (offline/blocked), the player falls back to the
         radiojar MP3 source automatically. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 600;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            margin: 20px 0;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status.playing {
            background: #10b981;
            color: white;
        }

        .status.loading {
            background: #f59e0b;
            color: white;
        }

        .status.error {
            background: #ef4444;
            color: white;
        }

        .status.offline {
            background: #6b7280;
            color: white;
        }

        /* Active-source indicator */
        .source-label {
            margin: 6px 0 0;
            font-size: 13px;
            color: #6b7280;
            min-height: 18px;
            transition: color 0.3s ease;
        }

        .source-label .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-inline-start: 6px;
            background: #9ca3af;
            vertical-align: middle;
        }

        .source-label.live {
            color: #047857;
            font-weight: 600;
        }

        .source-label.live .dot {
            background: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .controls {
            margin-top: 30px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-content {
            text-align: center;
            color: white;
        }

        .start-content h2 {
            font-size: 36px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .start-content p {
            font-size: 18px;
            opacity: 0.8;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .wave {
            display: inline-block;
            margin: 20px 0;
            height: 40px;
            min-height: 40px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .wave span {
            display: inline-block;
            width: 4px;
            height: 20px;
            margin: 0 2px;
            background: #667eea;
            animation: wave 1.2s infinite ease-in-out;
            transform-origin: bottom;
        }

        .wave span:nth-child(2) { animation-delay: -1.1s; }
        .wave span:nth-child(3) { animation-delay: -1.0s; }
        .wave span:nth-child(4) { animation-delay: -0.9s; }
        .wave span:nth-child(5) { animation-delay: -0.8s; }

        @keyframes wave {
            0%, 40%, 100% {
                transform: scaleY(1);
            }
            20% {
                transform: scaleY(2);
            }
        }

        /* Off-screen media element (carries audio; hidden, not display:none so
           audio keeps playing reliably on all browsers). */
        #player {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- Click to Start Overlay -->
    <div class="start-overlay" id="startOverlay" onclick="startRadio()">
        <div class="start-content">
            <h2>🕌 إذاعة القرآن الكريم</h2>
            <p>انقر في أي مكان للبدء</p>
            <p style="font-size: 14px; margin-top: 10px; opacity: 0.6;">Click anywhere to start</p>
        </div>
    </div>

    <div class="container">
        <h1>🕌 إذاعة القرآن الكريم</h1>
        <p style="color: #666; margin-bottom: 20px;">من القاهرة - البث المباشر</p>

        <div class="wave" id="waveAnimation" style="display: none;">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="status loading" id="status">جاري التحميل...</div>
        <div class="source-label" id="sourceLabel"><span class="dot"></span><span id="sourceText">—</span></div>

        <div class="controls">
            <button id="playButton" onclick="togglePlay()">▶️ تشغيل</button>
        </div>

        <div class="info">
            البث المباشر • تبديل تلقائي بين المصادر وإعادة محاولة لا نهائية عند انقطاع الاتصال
        </div>
    </div>

    <!-- Single media element for both HLS (via hls.js) and progressive MP3. -->
    <video id="player" playsinline webkit-playsinline preload="auto"></video>

    <script>
        const player = document.getElementById('player');
        const status = document.getElementById('status');
        const playButton = document.getElementById('playButton');
        const waveAnimation = document.getElementById('waveAnimation');
        const startOverlay = document.getElementById('startOverlay');
        const sourceLabel = document.getElementById('sourceLabel');
        const sourceText = document.getElementById('sourceText');

        // ---- Sources (in priority order) -------------------------------------
        // Official HLS first (authoritative .gov.eg), then radiojar as fallback.
        // The official master .m3u8 is stable (it's the default hardcoded in the
        // misrquran.gov.eg app bundle); only its inner variant rotates, which
        // hls.js re-resolves on its own.
        //
        // radiojar fallback caveat: the tokenized node URLs play over HTTPS until
        // their rj-tok expires; the tokenless stream.radiojar.com URL 302-redirects
        // to plain HTTP and is blocked as mixed content on an HTTPS page. They are
        // last-resort only — the official HLS above is the reliable source.
        const SOURCES = [
            {
                name: 'القناة الرسمية — misrquran.gov.eg',
                kind: 'hls',
                url: 'https://service.webvideocore.net/CL1olYogIrDWvwqiIKK7eCxOS4PStqG9DuEjAr2ZjZQtvS3d4y9r0cvRhvS17SGN/a_7a4vuubc6mo8.m3u8'
            },
            {
                name: 'راديوجار n0a (احتياطي)',
                kind: 'mp3',
                url: 'https://n0a.radiojar.com/8s5u5tpdtwzuv?rj-ttl=5&rj-tok=AAABfGwn9tsAO9sHl0eCkCvECQ'
            },
            {
                name: 'راديوجار n02 (احتياطي)',
                kind: 'mp3',
                url: 'https://n02.radiojar.com/8s5u5tpdtwzuv?rj-ttl=5&rj-tok=AAABmlil4fgAxbOpg5A8UZS87w'
            },
            {
                name: 'راديوجار (احتياطي)',
                kind: 'mp3',
                url: 'https://stream.radiojar.com/8s5u5tpdtwzuv'
            }
        ];

        let currentSourceIndex = 0;
        let triedThisRound = 0;     // sources tried since the last success

        let hasStarted = false;
        let retryTimeout = null;
        let attemptTimeout = null;
        let reconnecting = false;   // a reconnect round is in progress
        let attemptPending = false; // a single source attempt awaits resolution
        let hls = null;
        let backoff = 2000;
        const MAX_BACKOFF = 30000;
        const ATTEMPT_LIMIT = 8000; // give up on one source attempt after 8s

        // ---- Keep-awake -------------------------------------------------------
        // On a plugged-in kiosk the real killer is Chrome freezing the page once
        // playback stops (the media exemption vanishes the moment the stream
        // drops — exactly when recovery must run). Fight it two ways: Wake Lock
        // (keep screen on) + a muted canvas-stream video that keeps a media
        // element "playing" so the page is never frozen even while audio is dead.
        let wakeLock = null;
        let keepAliveVideo = null;
        let canvasDrawInterval = null;
        let keepAwakeEnabled = false;

        async function requestWakeLock() {
            if (wakeLock) return;
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (e) {
                console.log('Wake Lock unavailable:', e && e.message);
            }
        }

        function enableKeepAliveVideo() {
            if (keepAliveVideo) return;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 2;
                canvas.height = 2;
                const ctx = canvas.getContext('2d');
                let flip = false;
                canvasDrawInterval = setInterval(() => {
                    flip = !flip;
                    ctx.fillStyle = flip ? '#000000' : '#000001';
                    ctx.fillRect(0, 0, 2, 2);
                }, 1000);

                const stream = canvas.captureStream(1);
                keepAliveVideo = document.createElement('video');
                keepAliveVideo.srcObject = stream;
                keepAliveVideo.muted = true;
                keepAliveVideo.playsInline = true;
                keepAliveVideo.setAttribute('playsinline', '');
                keepAliveVideo.loop = true;
                keepAliveVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;';
                document.body.appendChild(keepAliveVideo);
                keepAliveVideo.play().catch(() => {});
            } catch (e) {
                console.log('Keep-alive video unavailable:', e && e.message);
            }
        }

        function enableKeepAwake() {
            if (keepAwakeEnabled) return;
            keepAwakeEnabled = true;
            requestWakeLock();
            enableKeepAliveVideo();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            if (!hasStarted) return;
            if (!wakeLock) requestWakeLock();
            if (keepAliveVideo && keepAliveVideo.paused) keepAliveVideo.play().catch(() => {});
            if (player.paused && !reconnecting) reconnect(); // died while away → revive
        });

        // ---- Status + source display -----------------------------------------
        function updateStatus(state, message) {
            status.className = `status ${state}`;
            status.textContent = message;

            if (state === 'playing') {
                waveAnimation.style.display = 'inline-block';
                playButton.textContent = '⏸️ إيقاف مؤقت';
            } else {
                waveAnimation.style.display = 'none';
                playButton.textContent = '▶️ تشغيل';
            }
        }

        function updateSourceLabel(src, live) {
            sourceText.textContent = src ? `المصدر: ${src.name}` : '—';
            sourceLabel.className = 'source-label' + (live ? ' live' : '');
        }

        function showStartOverlay(message) {
            startOverlay.style.display = 'flex';
            startOverlay.classList.remove('hidden');
            if (message) updateStatus('loading', message);
        }

        function hideOverlay() {
            startOverlay.classList.add('hidden');
            setTimeout(() => { startOverlay.style.display = 'none'; }, 500);
        }

        // ---- Source / attempt engine -----------------------------------------
        function clearRetry() {
            if (retryTimeout) { clearTimeout(retryTimeout); retryTimeout = null; }
        }

        function teardownHls() {
            if (hls) {
                try { hls.destroy(); } catch (e) {}
                hls = null;
            }
        }

        function wrapIndex(i) {
            return ((i % SOURCES.length) + SOURCES.length) % SOURCES.length;
        }

        // Begin a reconnect round: try the current source, failing over to the
        // next on each failure; once all sources fail, back off and start over.
        function reconnect() {
            if (!hasStarted || reconnecting) return;
            reconnecting = true;
            clearRetry();
            triedThisRound = 0;
            attemptSource(currentSourceIndex);
        }

        function attemptSource(i) {
            currentSourceIndex = wrapIndex(i);
            const src = SOURCES[currentSourceIndex];

            attemptPending = true;
            updateStatus('loading', 'جاري الاتصال...');
            updateSourceLabel(src, false);

            if (attemptTimeout) clearTimeout(attemptTimeout);
            // Bound the attempt: navigator.onLine can be true while the fiber is
            // down, in which case play()/HLS load may hang indefinitely.
            attemptTimeout = setTimeout(() => resolveAttempt(false), ATTEMPT_LIMIT);

            startAttempt(src);
        }

        function startAttempt(src) {
            teardownHls();

            if (src.kind === 'hls') {
                if (window.Hls && window.Hls.isSupported()) {
                    player.removeAttribute('src'); // let hls.js own the element via MSE
                    hls = new window.Hls({
                        enableWorker: true,
                        backBufferLength: 30,
                        manifestLoadingMaxRetry: 2,
                        levelLoadingMaxRetry: 2,
                        fragLoadingMaxRetry: 4
                    });
                    hls.on(window.Hls.Events.MANIFEST_PARSED, () => tryPlay());
                    hls.on(window.Hls.Events.ERROR, (evt, data) => {
                        if (!data || !data.fatal) return; // non-fatal: hls.js self-heals
                        console.warn('hls.js fatal error:', data.type, data.details);
                        if (attemptPending) resolveAttempt(false);
                        else if (!reconnecting) reconnect(); // dropped mid-play
                    });
                    hls.attachMedia(player);
                    hls.loadSource(src.url);
                    return;
                }
                if (player.canPlayType('application/vnd.apple.mpegurl')) {
                    player.src = src.url; // native HLS (Android Chrome / Safari)
                    player.load();
                    tryPlay();
                    return;
                }
                // HLS not playable here → skip to next source
                resolveAttempt(false);
                return;
            }

            // Progressive MP3
            player.src = src.url;
            player.load();
            tryPlay();
        }

        function tryPlay() {
            const p = player.play();
            if (p !== undefined) {
                p.then(() => resolveAttempt(true)).catch((err) => resolveAttempt(false, err));
            }
            // else: resolved by the 'playing' event or the attempt timeout
        }

        // Resolve the current attempt exactly once, whatever fires first
        // (play() promise, 'playing' event, media 'error', hls error, timeout).
        function resolveAttempt(ok, err) {
            if (!attemptPending) return;
            attemptPending = false;
            if (attemptTimeout) { clearTimeout(attemptTimeout); attemptTimeout = null; }

            if (ok) {
                reconnecting = false;
                triedThisRound = 0;
                backoff = 2000;
                markProgress();
                updateSourceLabel(SOURCES[currentSourceIndex], true);
                hideOverlay(); // playback started → dismiss the tap prompt
                return;
            }

            if (err && err.name === 'NotAllowedError') {
                // Autoplay blocked (no user gesture). Looping play() would spin
                // forever — ask for a tap instead.
                reconnecting = false;
                showStartOverlay('انقر للبدء');
                return;
            }

            // This source failed: try the next one immediately within this round.
            triedThisRound++;
            if (triedThisRound < SOURCES.length) {
                attemptSource(currentSourceIndex + 1);
                return;
            }

            // All sources failed → back off, then retry from the top source.
            // No online/offline event needed: this heals when the link returns.
            reconnecting = false;
            triedThisRound = 0;
            updateStatus('error', `لا يوجد اتصال — إعادة المحاولة خلال ${Math.round(backoff / 1000)} ث...`);
            retryTimeout = setTimeout(() => { currentSourceIndex = 0; reconnect(); }, backoff);
            backoff = Math.min(Math.round(backoff * 1.5), MAX_BACKOFF);
        }

        // ---- Playback watchdog ------------------------------------------------
        // Catches silent buffer stalls (live stream goes quiet with no error):
        // if currentTime stops advancing while we should be playing, reconnect.
        let lastTime = 0;
        let lastProgress = 0;
        let watchdog = null;
        const STALL_LIMIT = 10000;

        function monotonicNow() {
            return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
        }

        function markProgress() {
            lastTime = player.currentTime;
            lastProgress = monotonicNow();
        }

        function startWatchdog() {
            if (watchdog) return;
            markProgress();
            watchdog = setInterval(() => {
                if (!hasStarted || player.paused || reconnecting) return;
                if (player.currentTime > lastTime + 0.1) {
                    markProgress();
                } else if (monotonicNow() - lastProgress > STALL_LIMIT) {
                    console.warn('Watchdog: playback stalled, reconnecting');
                    reconnect();
                }
            }, 3000);
        }

        // ---- Controls ---------------------------------------------------------
        function pauseAudio() {
            clearRetry();
            if (attemptTimeout) { clearTimeout(attemptTimeout); attemptTimeout = null; }
            attemptPending = false;
            reconnecting = false;
            player.pause();
            updateStatus('loading', 'متوقف مؤقتاً');
            updateSourceLabel(SOURCES[currentSourceIndex], false);
        }

        function togglePlay() {
            if (player.paused) {
                backoff = 2000;
                reconnect();
            } else {
                pauseAudio();
            }
        }

        // ---- Start ------------------------------------------------------------
        // Core: begin (or restart) playback from the top source.
        function beginPlayback() {
            if (!hasStarted) {
                hasStarted = true;
                enableKeepAwake();
                startWatchdog();
            }
            backoff = 2000;
            currentSourceIndex = 0;
            reconnect();
        }

        // Called by a user tap on the overlay (a real gesture). Dismiss the
        // prompt optimistically and start.
        function startRadio() {
            hideOverlay();
            beginPlayback();
        }

        // Called on page load: attempt autoplay. We do NOT hide the overlay here —
        // if the browser permits autoplay (kiosk with built-up media engagement),
        // playback starts and resolveAttempt() hides the overlay; if it's blocked,
        // the NotAllowedError path keeps the overlay up for a single tap.
        function tryAutoStart() {
            beginPlayback();
        }

        // ---- Media events -----------------------------------------------------
        player.addEventListener('playing', () => {
            updateStatus('playing', '🎵 البث مباشر الآن');
            updateSourceLabel(SOURCES[currentSourceIndex], true);
            backoff = 2000;
            markProgress();
            if (attemptPending) resolveAttempt(true);
        });

        player.addEventListener('timeupdate', markProgress);

        player.addEventListener('waiting', () => {
            if (hasStarted) updateStatus('loading', 'جاري التحميل...');
        });

        player.addEventListener('pause', () => {
            if (!player.ended && hasStarted && !reconnecting && !attemptPending) {
                updateStatus('loading', 'متوقف مؤقتاً');
            }
        });

        player.addEventListener('error', () => {
            if (!hasStarted) return;
            if (attemptPending) { resolveAttempt(false); return; }
            if (!reconnecting) {
                updateStatus('error', 'خطأ في البث - جاري إعادة المحاولة...');
                clearRetry();
                retryTimeout = setTimeout(reconnect, 1000);
            }
        });

        player.addEventListener('stalled', () => {
            if (hasStarted && !player.paused && !reconnecting) reconnect();
        });

        player.addEventListener('loadstart', () => {
            if (hasStarted) updateStatus('loading', 'جاري الاتصال...');
        });

        // ---- Network hints (status only; recovery doesn't depend on these) ----
        window.addEventListener('online', () => {
            if (hasStarted && player.paused) { backoff = 2000; reconnect(); }
        });

        window.addEventListener('offline', () => {
            updateStatus('offline', '❌ لا يوجد اتصال بالإنترنت');
        });

        // ---- Auto-start on load -----------------------------------------------
        // Tries to autoplay; if the browser blocks autoplay-with-sound, the
        // overlay stays up and a single tap starts it.
        window.addEventListener('load', tryAutoStart);

        // ---- Cleanup ----------------------------------------------------------
        window.addEventListener('beforeunload', () => {
            clearRetry();
            if (attemptTimeout) clearTimeout(attemptTimeout);
            if (watchdog) clearInterval(watchdog);
            if (canvasDrawInterval) clearInterval(canvasDrawInterval);
            teardownHls();
            player.pause();
        });
    </script>
</body>
</html>
